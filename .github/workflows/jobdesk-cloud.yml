name: JobDesk Cloud
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Chỉ bật ở lần đầu hoặc sau khi phục hồi bản lưu'
        type: boolean
        default: false
      dry_run:
        description: 'Chỉ quét và cập nhật trang, chưa gửi Gmail'
        type: boolean
        default: true

concurrency:
  group: jobdesk-cloud
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      site_ready: ${{ steps.website.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Restore encrypted state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cloud-state/state.enc
          key: jobdesk-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobdesk-state-v1-
      - name: Search and notify
        id: scan
        run: bun run tools/cloud-run.ts
        env:
          JOBDESK_STATE_KEY: ${{ secrets.JOBDESK_STATE_KEY }}
          JOBDESK_VIEW_KEY: ${{ secrets.JOBDESK_VIEW_KEY }}
          JOBDESK_SETTINGS: ${{ secrets.JOBDESK_SETTINGS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOBDESK_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && 'true' || 'false' }}
          JOBDESK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      - name: Save encrypted state
        if: always() && steps.scan.outcome != 'skipped' && hashFiles('.cloud-state/state.enc') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cloud-state/state.enc
          key: jobdesk-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Backup encrypted state
        if: always() && hashFiles('.cloud-state/state.enc') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jobdesk-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloud-state/state.enc
          retention-days: 7
      - name: Check website output
        id: website
        if: always()
        run: |
          if (Test-Path -LiteralPath cloud-site/report.enc) { 'ready=true' >> $env:GITHUB_OUTPUT }
      - name: Prepare website
        if: always() && hashFiles('cloud-site/report.enc') != ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: cloud-site

  publish:
    needs: scan
    if: always() && !cancelled() && needs.scan.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy encrypted dashboard
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
